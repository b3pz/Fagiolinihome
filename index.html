<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Fagiolini</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div><b>FAGIOLINI</b><h1>Oggi</h1><span id="date"></span></div><button id="reset">↻</button></header><main>
<section id="home" class="view on"><h2>Bambini</h2><div id="kids" class="grid"></div><div class="title"><h2>Casa</h2><button data-go="house">Apri</button></div><div id="housePrev" class="card"></div><div class="title"><h2>Menu di oggi</h2><button data-go="menu">Apri menu</button></div><div id="menuPrev" class="card meals"></div><div class="title"><h2>Task</h2><button data-go="tasks">Vedi task</button></div><div id="taskPrev" class="card"></div><div class="title"><h2>Spesa</h2><button data-go="shop">Apri lista</button></div><div id="shopPrev" class="card"></div></section>
<section id="child" class="view"><div class="title"><h2 id="kidTitle"></h2><button data-go="home">← Home</button></div><div id="stats" class="stats"></div><div class="card"><h3>Registra adesso</h3><div class="actions"><button data-ev="pappa">🍼<small>Pappa</small></button><button data-ev="pannolino">🚼<small>Pannolino</small></button><button data-ev="cacca">💩<small>Cacca</small></button><button data-ev="nanna">😴<small>Nanna</small></button><button data-ev="bagnetto">🛁<small>Bagnetto</small></button></div></div><div class="card"><div class="title"><h3>Registro</h3><div><button id="prev">←</button><span id="day"></span><button id="next">→</button></div></div><div id="timeline"></div></div></section>
<section id="tasks" class="view"><div class="title"><h2>Task</h2><button data-go="home">← Home</button></div><form id="taskForm" class="form card"><input id="taskText" placeholder="Es. Fare una lavatrice"><select id="taskOwner"><option>Famiglia</option><option>JJ</option><option>Kiki</option></select><button>Aggiungi</button></form><div id="taskList" class="card"></div></section>
<section id="house" class="view"><div class="title"><h2>🧹 Casa</h2><button data-go="home">← Home</button></div><form id="houseForm" class="form card"><input id="houseText" placeholder="Es. Pulire bagno"><select id="houseOwner"><option>Famiglia</option><option>JJ</option><option>Kiki</option></select><select id="freq"><option value="giornaliera">Giornaliera</option><option value="settimanale">Settimanale</option><option value="mensile">Mensile</option></select><button>Aggiungi</button></form><div class="tabs"><button data-f="tutte" class="sel">Tutte</button><button data-f="giornaliera">Giornaliere</button><button data-f="settimanale">Settimanali</button><button data-f="mensile">Mensili</button></div><div id="houseList" class="card"></div></section>
<section id="shop" class="view"><div class="title"><h2>🛒 Spesa</h2><button data-go="home">← Home</button></div><form id="shopForm" class="form card"><input id="shopText" placeholder="Es. Pannolini"><input id="qty" placeholder="Qtà"><select id="cat"><option>Alimentari</option><option>Bambini</option><option>Casa</option><option>Cane</option><option>Altro</option></select><button>Aggiungi</button></form><div id="shopList" class="card"></div></section>
<section id="menu" class="view"><div class="title"><h2>🍝 Menu</h2><button data-go="home">← Home</button></div><div id="menuDays"></div></section>
</main><nav><button data-go="home">🏠<small>Home</small></button><button data-go="house">🧹<small>Casa</small></button><button id="quick" class="plus">＋<small>Rapido</small></button><button data-go="shop">🛒<small>Spesa</small></button><button id="kidsBtn">👶<small>Bimbi</small></button></nav></div>
<dialog id="poop"><form id="poopForm"><h3>💩 Cacca</h3><select id="poopType"><option>Normale</option><option>Dura</option><option>Morbida</option><option>Liquida</option></select><input id="poopNote" placeholder="Nota facoltativa"><button>Salva</button><button type="button" data-close="poop">Annulla</button></form></dialog>
<dialog id="sleep"><form id="sleepForm"><h3>😴 Nanna</h3><p id="sleepText"></p><button>Conferma</button><button type="button" data-close="sleep">Annulla</button></form></dialog>
<dialog id="quickDlg"><div><h3>Aggiunta rapida</h3><div id="qkids" class="grid"></div><div id="qev" class="actions"></div><button data-close="quickDlg">Chiudi</button></div></dialog>
<script src="app.js"></script></body></html>
