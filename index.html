<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>Family Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">FAMILY HUB</div>
        <h1 id="welcomeTitle">Oggi</h1>
        <div id="todayDate" class="muted"></div>
      </div>
      <button id="resetBtn" class="icon-btn" title="Reset dati">↻</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="section-title-row">
          <h2>Bambini</h2>
        </div>
        <div id="childrenCards" class="children-grid"></div>

        <div class="section-title-row">
          <h2>Oggi</h2>
          <button class="link-btn" data-nav="tasks">Vedi task</button>
        </div>
        <div id="todayTasks" class="card list-card"></div>

        <div class="section-title-row">
          <h2>Spesa</h2>
          <button class="link-btn" data-nav="shopping">Apri lista</button>
        </div>
        <div id="shoppingPreview" class="card list-card"></div>
      </section>

      <section id="childView" class="view">
        <div class="child-header card">
          <div>
            <div class="eyebrow">BAMBINO</div>
            <h2 id="childNameTitle"></h2>
          </div>
          <button class="secondary-btn" data-nav="home">← Home</button>
        </div>

        <div id="childSummary" class="stats-grid"></div>

        <div class="card">
          <h3>Registra adesso</h3>
          <div class="quick-grid">
            <button class="quick-action" data-event="pappa"><span>🍼</span>Pappa</button>
            <button class="quick-action" data-event="pannolino"><span>🚼</span>Pannolino</button>
            <button class="quick-action" data-event="cacca"><span>💩</span>Cacca</button>
            <button class="quick-action" data-event="nanna"><span>😴</span>Nanna</button>
            <button class="quick-action" data-event="bagnetto"><span>🛁</span>Bagnetto</button>
          </div>
        </div>

        <div class="card">
          <div class="section-title-row compact">
            <h3>Registro di oggi</h3>
            <span id="eventCount" class="pill"></span>
          </div>
          <div id="childTimeline" class="timeline"></div>
        </div>
      </section>

      <section id="tasksView" class="view">
        <div class="section-title-row">
          <div>
            <div class="eyebrow">ROUTINE</div>
            <h2>Task</h2>
          </div>
          <button class="secondary-btn" data-nav="home">← Home</button>
        </div>
        <form id="taskForm" class="add-form card">
          <input id="taskInput" type="text" placeholder="Es. Fare una lavatrice" autocomplete="off">
          <select id="taskOwner">
            <option value="Famiglia">Famiglia</option>
            <option value="Papà">Papà</option>
            <option value="Mamma">Mamma</option>
          </select>
          <button type="submit">Aggiungi</button>
        </form>
        <div id="tasksList" class="card list-card"></div>
      </section>

      <section id="shoppingView" class="view">
        <div class="section-title-row">
          <div>
            <div class="eyebrow">CASA</div>
            <h2>Spesa</h2>
          </div>
          <button class="secondary-btn" data-nav="home">← Home</button>
        </div>
        <form id="shoppingForm" class="add-form card">
          <input id="shoppingInput" type="text" placeholder="Es. Pannolini" autocomplete="off">
          <button type="submit">Aggiungi</button>
        </form>
        <div id="shoppingList" class="card list-card"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-nav="home" class="nav-item active"><span>🏠</span>Home</button>
      <button data-nav="tasks" class="nav-item"><span>✅</span>Task</button>
      <button id="quickAddBtn" class="nav-item center"><span>＋</span>Rapido</button>
      <button data-nav="shopping" class="nav-item"><span>🛒</span>Spesa</button>
      <button id="childrenNavBtn" class="nav-item"><span>👶</span>Bimbi</button>
    </nav>
  </div>

  <dialog id="quickDialog">
    <form method="dialog" class="dialog-card">
      <div class="section-title-row compact">
        <h3>Aggiunta rapida</h3>
        <button value="cancel" class="icon-btn">✕</button>
      </div>
      <p class="muted">Scegli il bambino e cosa vuoi registrare.</p>
      <div id="quickChildChooser" class="chooser"></div>
      <div id="quickEventChooser" class="quick-grid"></div>
    </form>
  </dialog>

  <dialog id="poopDialog">
    <form id="poopForm" class="dialog-card">
      <div class="section-title-row compact">
        <h3>💩 Cacca</h3>
        <button type="button" class="icon-btn" id="closePoopDialog">✕</button>
      </div>
      <label>Com'era?</label>
      <div class="segmented">
        <input type="radio" name="poopType" id="poop-normal" value="Normale" checked><label for="poop-normal">Normale</label>
        <input type="radio" name="poopType" id="poop-dura" value="Dura"><label for="poop-dura">Dura</label>
        <input type="radio" name="poopType" id="poop-morbida" value="Morbida"><label for="poop-morbida">Morbida</label>
        <input type="radio" name="poopType" id="poop-liquida" value="Liquida"><label for="poop-liquida">Liquida</label>
      </div>
      <input id="poopNote" type="text" placeholder="Nota facoltativa">
      <button type="submit" class="primary-btn full">Salva</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
